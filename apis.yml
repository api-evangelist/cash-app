aid: cash-app
url: https://raw.githubusercontent.com/api-evangelist/cash-app/refs/heads/main/apis.yml
name: Cash App
kind: company
description: Cash App is a consumer mobile-first financial services platform operated
  by Block, Inc. (formerly Square, Inc.), a publicly traded company. Cash App is not
  itself a chartered bank; its banking, card, and lending features are delivered
  through partner institutions (deposit accounts and the Cash App Card are issued
  by partner banks, historically Sutton Bank and Lincoln Savings Bank; brokerage and
  bitcoin services run through Block subsidiaries). Its public developer surface is
  a merchant/PSP payment-acceptance product, not a consumer-permissioned data-access
  API - Cash App Pay lets partners and payment service providers charge customers
  directly from their Cash App balance or linked funding source, and the Afterpay
  (Cash App Afterpay) buy-now-pay-later product is offered through the same portal.
  Block runs a real, public first-party developer portal at developers.cash.app
  (built on Fern) that publishes downloadable OpenAPI 3.1 specifications for the Cash
  App Pay Partner API (Customer Request, Network, and Management APIs on api.cash.app)
  and the Afterpay Global API (on global-api.afterpay.com). Consumer-side account
  data is reached by third parties through aggregators (e.g. Plaid) rather than a
  first-party FDX data-access API; no FDX participation or CFPB Section 1033
  data-rights posture is documented in the developer portal.
