  kind: cross-platform-ui
  docs: https://developers.cash.app/cash-app-pay-partner-api/guides/pay-kit-sdk/pay-kit-web-overview/react-native-requirements
note: |
  Pay Kit is the client-side embeddable checkout surface (distinct from the server-side REST APIs).
  The web SDK is a CDN-hosted component; iOS/Android are native UI SDKs (also listed in packages/).
