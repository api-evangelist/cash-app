resource_errors:
  grant: [GRANT_NOT_FOUND, GRANT_CONSUMED, GRANT_EXPIRED, GRANT_REVOKED, GRANT_ACTION_TYPE_MISMATCH]
  merchant: [MERCHANT_NOT_FOUND, MERCHANT_DISABLED, MERCHANT_PENDING, MERCHANT_MISSING_ADDRESS_OR_SITE,
    MISSING_SETTLEMENT_CONFIGURATION]
  brand: [BRAND_NOT_FOUND]
  customer: [CUSTOMER_DELETED_ACCOUNT, CUSTOMER_DISABLED]
