  validation: [EXPECTED_STRING, EXPECTED_INTEGER, EXPECTED_BOOLEAN, VALUE_EMPTY, VALUE_TOO_LONG,
    VALUE_TOO_HIGH, VALUE_TOO_LOW, INVALID_PHONE_NUMBER, INVALID_TIME, INVALID_REGION, MISSING_REGION,
    FEATURE_DISABLED]
