- code: INTERNAL_SERVER_ERROR
  category: API_ERROR
  status: 500
  retry: retryable
  title: Unexpected server error
- code: SERVICE_UNAVAILABLE
  category: API_ERROR
  status: 503
  retry: retryable
  title: Service temporarily unavailable
- code: GATEWAY_TIMEOUT
  category: API_ERROR
  status: 504
  retry: retryable
