arazzo: 1.0.1
info:
  title: Cash App Afterpay checkout for BigCommerce orders
  summary: Offer Afterpay (Cash App) at checkout for a BigCommerce order.
  description: Reads an order from BigCommerce, creates an Afterpay checkout on the Cash App Afterpay API for its total, and hands the shopper the Afterpay redirect URL. Recreates the Afterpay BigCommerce
    platform integration as a forkable workflow.
  version: 1.0.0
sourceDescriptions:
- name: cashAppCheckoutsApi
  url: https://raw.githubusercontent.com/api-evangelist/cash-app/refs/heads/main/openapi/cash-app-checkouts-api-openapi.yml
  type: openapi
- name: bigcommerceOrderApi
  url: https://raw.githubusercontent.com/api-evangelist/bigcommerce/refs/heads/main/openapi/bigcommerce-order-api-openapi.yml
  type: openapi
workflows:
- workflowId: cash-app-bigcommerce-afterpay-checkout
  summary: BigCommerce order to Afterpay checkout
  description: Fetch the BigCommerce order, create an Afterpay checkout for it, and record the checkout token back where the platform allows.
  inputs:
    type: object
    properties:
      orderId:
        type: integer
      afterpayAuthorization:
        type: string
        description: Basic auth header for the Afterpay merchant account
      userAgent:
        type: string
      redirectConfirmUrl:
        type: string
      redirectCancelUrl:
        type: string
  steps:
  - stepId: get-bigcommerce-order
    description: Get the BigCommerce storefront order.
    operationId: $sourceDescriptions.bigcommerceOrderApi.getOrder
    parameters:
    - name: orderId
      in: path
      value: $inputs.orderId
    - name: include
      in: query
      value: billingAddress,currency
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      orderId: $response.body#/orderId
      orderAmount: $response.body#/orderAmount
      currency: $response.body#/currency/code
      email: $response.body#/billingAddress/email
  - stepId: create-afterpay-checkout
    description: Create an Afterpay checkout for the order total and get the redirect URL.
    operationId: $sourceDescriptions.cashAppCheckoutsApi.create-checkout-1
    parameters:
    - name: Authorization
      in: header
      value: $inputs.afterpayAuthorization
    - name: User-Agent
      in: header
      value: $inputs.userAgent
    requestBody:
      contentType: application/json
      payload:
        amount:
          amount: $steps.get-bigcommerce-order.outputs.orderAmount
          currency: $steps.get-bigcommerce-order.outputs.currency
        consumer:
          email: $steps.get-bigcommerce-order.outputs.email
        merchantReference: $steps.get-bigcommerce-order.outputs.orderId
        merchant:
          redirectConfirmUrl: $inputs.redirectConfirmUrl
          redirectCancelUrl: $inputs.redirectCancelUrl
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      checkoutToken: $response.body#/token
      redirectCheckoutUrl: $response.body#/redirectCheckoutUrl
      expires: $response.body#/expires
  outputs:
    checkoutToken: $steps.create-afterpay-checkout.outputs.checkoutToken
    redirectCheckoutUrl: $steps.create-afterpay-checkout.outputs.redirectCheckoutUrl
