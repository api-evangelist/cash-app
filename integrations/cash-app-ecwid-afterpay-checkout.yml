arazzo: 1.0.1
info:
  title: Cash App Afterpay checkout for Ecwid orders
  summary: Offer Afterpay (Cash App) at checkout for a Ecwid order.
  description: Reads an order from Ecwid, creates an Afterpay checkout on the Cash App Afterpay API for its total, and hands the shopper the Afterpay redirect URL. Recreates the Afterpay Ecwid platform
    integration as a forkable workflow.
  version: 1.0.0
sourceDescriptions:
- name: cashAppCheckoutsApi
  url: https://raw.githubusercontent.com/api-evangelist/cash-app/refs/heads/main/openapi/cash-app-checkouts-api-openapi.yml
  type: openapi
- name: ecwidOrdersApi
  url: https://raw.githubusercontent.com/api-evangelist/ecwid/refs/heads/main/openapi/ecwid-orders-api-openapi.yml
  type: openapi
workflows:
- workflowId: cash-app-ecwid-afterpay-checkout
  summary: Ecwid order to Afterpay checkout
  description: Fetch the Ecwid order, create an Afterpay checkout for it, and record the checkout token back where the platform allows.
  inputs:
    type: object
    properties:
      orderNumber:
        type: integer
      currency:
        type: string
        description: Store currency (not on the Ecwid order schema)
      afterpayAuthorization:
        type: string
        description: Basic auth header for the Afterpay merchant account
      userAgent:
        type: string
      redirectConfirmUrl:
        type: string
      redirectCancelUrl:
        type: string
  steps:
  - stepId: get-ecwid-order
    description: Get the Ecwid order.
    operationId: $sourceDescriptions.ecwidOrdersApi.getOrder
    parameters:
    - name: orderNumber
      in: path
      value: $inputs.orderNumber
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      orderNumber: $response.body#/orderNumber
      total: $response.body#/total
      email: $response.body#/email
  - stepId: create-afterpay-checkout
    description: Create an Afterpay checkout for the order total and get the redirect URL.
    operationId: $sourceDescriptions.cashAppCheckoutsApi.create-checkout-1
    parameters:
    - name: Authorization
      in: header
      value: $inputs.afterpayAuthorization
    - name: User-Agent
      in: header
      value: $inputs.userAgent
    requestBody:
      contentType: application/json
      payload:
        amount:
          amount: $steps.get-ecwid-order.outputs.total
          currency: $inputs.currency
        consumer:
          email: $steps.get-ecwid-order.outputs.email
        merchantReference: $steps.get-ecwid-order.outputs.orderNumber
        merchant:
          redirectConfirmUrl: $inputs.redirectConfirmUrl
          redirectCancelUrl: $inputs.redirectCancelUrl
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      checkoutToken: $response.body#/token
      redirectCheckoutUrl: $response.body#/redirectCheckoutUrl
      expires: $response.body#/expires
  - stepId: mark-ecwid-order
    description: Record the Afterpay checkout token on the order.
    operationId: $sourceDescriptions.ecwidOrdersApi.updateOrder
    parameters:
    - name: orderNumber
      in: path
      value: $inputs.orderNumber
    requestBody:
      contentType: application/json
      payload:
        paymentStatus: AWAITING_PAYMENT
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      status: $statusCode
  outputs:
    checkoutToken: $steps.create-afterpay-checkout.outputs.checkoutToken
    redirectCheckoutUrl: $steps.create-afterpay-checkout.outputs.redirectCheckoutUrl
    writebackStatus: $steps.mark-ecwid-order.outputs.status
x-integration:
  partner: ecwid
  template: null
  edge_evidence: https://developers.cash.app/afterpay/guides/platforms/ecwid.md
  edge_type: claimed
