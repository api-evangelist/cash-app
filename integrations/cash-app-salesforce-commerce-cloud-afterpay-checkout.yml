arazzo: 1.0.1
info:
  title: Cash App Afterpay checkout for Salesforce Commerce Cloud baskets
  summary: Offer Afterpay (Cash App) at checkout for a Salesforce Commerce Cloud order.
  description: Reads an order from Salesforce Commerce Cloud, creates an Afterpay checkout on the Cash App Afterpay API for its total, and hands the shopper the Afterpay redirect URL. Recreates the Afterpay
    Salesforce Commerce Cloud platform integration as a forkable workflow.
  version: 1.0.0
sourceDescriptions:
- name: cashAppCheckoutsApi
  url: https://raw.githubusercontent.com/api-evangelist/cash-app/refs/heads/main/openapi/cash-app-checkouts-api-openapi.yml
  type: openapi
- name: sfccShopperApi
  url: https://raw.githubusercontent.com/api-evangelist/salesforce-commerce-cloud/refs/heads/main/openapi/salesforce-commerce-cloud-shopper-api-openapi.yml
  type: openapi
workflows:
- workflowId: cash-app-salesforce-commerce-cloud-afterpay-checkout
  summary: Salesforce Commerce Cloud order to Afterpay checkout
  description: Fetch the Salesforce Commerce Cloud order, create an Afterpay checkout for it, and record the checkout token back where the platform allows.
  inputs:
    type: object
    properties:
      organizationId:
        type: string
      basketId:
        type: string
      siteId:
        type: string
      afterpayAuthorization:
        type: string
        description: Basic auth header for the Afterpay merchant account
      userAgent:
        type: string
      redirectConfirmUrl:
        type: string
      redirectCancelUrl:
        type: string
  steps:
  - stepId: get-sfcc-basket
    description: Get the shopper basket being checked out.
    operationId: $sourceDescriptions.sfccShopperApi.getBasket
    parameters:
    - name: organizationId
      in: path
      value: $inputs.organizationId
    - name: basketId
      in: path
      value: $inputs.basketId
    - name: siteId
      in: query
      value: $inputs.siteId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      basketId: $response.body#/basketId
      orderTotal: $response.body#/orderTotal
      currency: $response.body#/currency
      email: $response.body#/customerInfo/email
  - stepId: create-afterpay-checkout
    description: Create an Afterpay checkout for the order total and get the redirect URL.
    operationId: $sourceDescriptions.cashAppCheckoutsApi.create-checkout-1
    parameters:
    - name: Authorization
      in: header
      value: $inputs.afterpayAuthorization
    - name: User-Agent
      in: header
      value: $inputs.userAgent
    requestBody:
      contentType: application/json
      payload:
        amount:
          amount: $steps.get-sfcc-basket.outputs.orderTotal
          currency: $steps.get-sfcc-basket.outputs.currency
        consumer:
          email: $steps.get-sfcc-basket.outputs.email
        merchantReference: $steps.get-sfcc-basket.outputs.basketId
        merchant:
          redirectConfirmUrl: $inputs.redirectConfirmUrl
          redirectCancelUrl: $inputs.redirectCancelUrl
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      checkoutToken: $response.body#/token
      redirectCheckoutUrl: $response.body#/redirectCheckoutUrl
      expires: $response.body#/expires
  outputs:
    checkoutToken: $steps.create-afterpay-checkout.outputs.checkoutToken
    redirectCheckoutUrl: $steps.create-afterpay-checkout.outputs.redirectCheckoutUrl
