arazzo: 1.0.1
info:
  title: Cash App Afterpay checkout for Wix orders
  summary: Offer Afterpay (Cash App) at checkout for a Wix order.
  description: Reads an order from Wix, creates an Afterpay checkout on the Cash App Afterpay API for its total, and hands the shopper the Afterpay redirect URL. Recreates the Afterpay Wix platform integration
    as a forkable workflow.
  version: 1.0.0
sourceDescriptions:
- name: cashAppCheckoutsApi
  url: https://raw.githubusercontent.com/api-evangelist/cash-app/refs/heads/main/openapi/cash-app-checkouts-api-openapi.yml
  type: openapi
- name: wixOrdersApi
  url: https://raw.githubusercontent.com/api-evangelist/wix/refs/heads/main/openapi/wix-orders-api-openapi.yml
  type: openapi
workflows:
- workflowId: cash-app-wix-afterpay-checkout
  summary: Wix order to Afterpay checkout
  description: Fetch the Wix order, create an Afterpay checkout for it, and record the checkout token back where the platform allows.
  inputs:
    type: object
    properties:
      orderId:
        type: string
      afterpayAuthorization:
        type: string
        description: Basic auth header for the Afterpay merchant account
      userAgent:
        type: string
      redirectConfirmUrl:
        type: string
      redirectCancelUrl:
        type: string
  steps:
  - stepId: get-wix-order
    description: Get the Wix eCommerce order.
    operationId: $sourceDescriptions.wixOrdersApi.getOrder
    parameters:
    - name: id
      in: path
      value: $inputs.orderId
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      orderId: $response.body#/order/id
      total: $response.body#/order/priceSummary/total/amount
      currency: $response.body#/order/currency
      email: $response.body#/order/buyerInfo/email
  - stepId: create-afterpay-checkout
    description: Create an Afterpay checkout for the order total and get the redirect URL.
    operationId: $sourceDescriptions.cashAppCheckoutsApi.create-checkout-1
    parameters:
    - name: Authorization
      in: header
      value: $inputs.afterpayAuthorization
    - name: User-Agent
      in: header
      value: $inputs.userAgent
    requestBody:
      contentType: application/json
      payload:
        amount:
          amount: $steps.get-wix-order.outputs.total
          currency: $steps.get-wix-order.outputs.currency
        consumer:
          email: $steps.get-wix-order.outputs.email
        merchantReference: $steps.get-wix-order.outputs.orderId
        merchant:
          redirectConfirmUrl: $inputs.redirectConfirmUrl
          redirectCancelUrl: $inputs.redirectCancelUrl
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      checkoutToken: $response.body#/token
      redirectCheckoutUrl: $response.body#/redirectCheckoutUrl
      expires: $response.body#/expires
  outputs:
    checkoutToken: $steps.create-afterpay-checkout.outputs.checkoutToken
    redirectCheckoutUrl: $steps.create-afterpay-checkout.outputs.redirectCheckoutUrl
x-integration:
  partner: wix
  template: null
