components:
  schemas:
    evidence:
      type: object
      properties:
        productDescription:
          type: string
          description: A description of the product or service and any relevant details on how this was presented to the customer at the time of purchase.
        refundPolicy:
          type: string
          format: binary
          description: Token of the file upload. The merchant’s refund policy, as shown or provided to the customer.
        refundPolicyDisclosure:
          type: string
          description: An explanation of how and when the customer was shown or provided with the merchant’s refund policy prior to purchase.
        refundRefusalExplanation:
          type: string
          description: The merchant’s explanation for why the customer is not entitled to a refund.
        shippingDocumentation:
          type: string
          format: binary
          description: Token of the file upload. A shipping label or receipt for the disputed payment.
        shippingAddress:
          type: string
          description: The address to which a physical product was shipped.
        shippingDate:
          type: string
          description: In cases of physical products, the date that a physical product began its route to the shipping address in a clear human-readable format. This date should be prior to the date of the dispute.
        shippingCarrier:
          type: string
          description: In cases of physical products, the delivery service that shipped a physical product, such as Fedex, UPS, USPS, etc. If multiple carriers were used for this purchase, separate them with commas.
        shippingTrackingNumber:
          type: string
          description: The tracking number for a physical product, obtained from the delivery service.
        uncategorizedFile:
          type: string
          format: binary
          description: Token of the file upload. Additional file that’s not in any of the categories above.
        uncategorizedText:
          type: string
          description: Any additional text deemed relevant by the merchant.
      title: evidence
    DisputeReason:
      type: string
      enum:
      - product_not_received
      - product_unacceptable
      - credit_not_processed
      - order_canceled
      - duplicate
      - incorrect_amount
      - paid_by_other_means
      - fraudulent
      - fraudulent_merchant
      description: The reason for the dispute.
      title: DisputeReason
    DisputeClosingReason:
      type: string
      enum:
      - merchant_accepted
      - evidence_accepted
      - evidence_rejected
      - deadline_expired
      - customer_cancelled
      description: A reason indicating how the final decision on the dispute was reached. Recommended possible values listed in Closing Reasons.
      title: DisputeClosingReason
    retrieve-dispute_Response_200:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/dispute'
          description: An array of dispute objects that match the filter criteria in the request.
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
      title: retrieve-dispute_Response_200
    upload-file_Response_200:
      type: object
      properties:
        id:
          type: string
          description: The ID token of the file.
        createdAt:
          type: string
          format: date-time
          description: The timestamp indicating when the file was uploaded.
        expiresAt:
          type: string
          format: date-time
          description: 'The timestamp indicating when the uploaded file expires. '
      title: upload-file_Response_200
    dispute:
      type: object
      properties:
        id:
          type: string
          description: Dispute identifier
        order:
          type: string
          description: The token of the order that the dispute is for.
        amount:
          type: string
          description: The amount of the dispute
        reason:
          $ref: '#/components/schemas/DisputeReason'
          description: The reason for the dispute.
        status:
          $ref: '#/components/schemas/DisputeStatus'
          description: The current state of the dispute. Values depend on how the dispute state machine is modeled.
        open:
          type: boolean
          default: true
          description: '`True` if a final decision on the dispute hasn''t been made yet.'
        responseDueBy:
          type: string
          description: Deadline by which the merchant must respond to the dispute. (Epoch timestamp in seconds, timezone UTC +0.00)
        createdAt:
          type: string
          description: A timestamp indicating when the dispute was created. (Epoch timestamp in seconds, timezone UTC +0.00)
        openingNote:
          type: string
          description: Text from the customer describing why the dispute was opened or the reason for the complaint. While dispute category codes are helpful at informing what a merchant should present, it doesn’t provide reasoning behind the customer’s complaint. In some cases, this can help merchants troubleshoot the dispute directly with their customers.
        openingNoteAttachments:
          type: string
          description: Attachments to supplement the `openingNote` if the customer provided photos or screenshots as part of their dispute description.
        updatedAt:
          type: string
          description: Timestamp when the dispute was updated. (Epoch timestamp in seconds, timezone UTC +0.00)
        closingReason:
          $ref: '#/components/schemas/DisputeClosingReason'
          description: A reason indicating how the final decision on the dispute was reached. Recommended possible values listed in Closing Reasons.
        closingNote:
          type: string
          description: Text describing in detail how the final decision on the dispute was reached. This supplements the `closingReason`.
        merchantOrderId:
          type: string
          description: The identifier for the transaction on the merchant side.
        transactionDate:
          type: string
          description: The timestamp of the order created by the customer. (Epoch timestamp in seconds, timezone UTC +0.00)
        settlementAmount:
          type: string
          description: The settlementAmount for audit usage.
        meta:
          $ref: '#/components/schemas/meta'
          description: The extra information for merchants to match payment.
      required:
      - id
      - order
      - amount
      - reason
      - status
      - open
      - responseDueBy
      - createdAt
      - openingNote
      - closingReason
      - merchantOrderId
      - transactionDate
      - settlementAmount
      description: Dispute object
      title: dispute
    meta:
      type: object
      properties:
        transactionAmount:
          type: string
          description: The transaction amount for the order.
        network:
          type: string
          description: The payment network used by the customer. (For example, `Visa` or `MasterCard`)
        networkReferenceId:
          type: string
          description: The identifier for the payment.
        orderType:
          type: string
          description: The type of order. `ONLINE` or `INSTORE`
      required:
      - transactionAmount
      - orderType
      title: meta
    DisputeStatus:
      type: string
      enum:
      - needs_response
      - under_review
      - won
      - lost
      - merchant_refunded
      - merchant_voided
      description: The current state of the dispute. Values depend on how the dispute state machine is modeled.
      title: DisputeStatus
    retrieve-file_Response_200:
      type: object
      properties:
        url:
          type: string
          description: The link of the file to be retrieved.
        expiresAt:
          type: string
          format: date-time
          description: The timestamp indicating the expiration of the link.
      title: retrieve-file_Response_200
    Disputes_create-dispute-evidence-text_Response_201:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/DisputeEvidence'
      title: Disputes_create-dispute-evidence-text_Response_201
    DisputeEvidenceFile:
      type: object
      properties:
        filename:
          type: string
          description: Name of the uploaded file. It should be descriptive enough to indicate what type of information is contained in the uploaded file.
        content_type:
          $ref: '#/components/schemas/DisputeEvidenceFileContentType'
          description: 'The MIME type of the uploaded file.


            Current values:


            - `application/pdf`

            - `image/heic`

            - `image/heif`

            - `image/jpeg`

            - `image/png`

            - `image/tiff`'
      required:
      - filename
      - content_type
      description: If the evidence is of type `FILE`, contains metadata about the binary file uploaded as evidence.
      title: DisputeEvidenceFile
    DisputeEvidence:
      type: object
      properties:
        id:
          type: string
          description: 'A unique identifier for the dispute evidence issued by Cash App.


            Min length: `1`

            Max length: `128`'
        dispute_id:
          type: string
          description: 'ID of the dispute this evidence is associated with.


            Min length: `1`

            Max length: `128`'
        category:
          $ref: '#/components/schemas/DisputeEvidenceCategory'
          description: 'Describes what type of information is contained in this piece of evidence.


            Current values:


            - `GENERIC_EVIDENCE`: Default evidence type used if no other category applies.

            - `ONLINE_OR_APP_ACCESS_LOG`: Server or activity logs that show proof of the cardholder’s identity and that the cardholder successfully ordered and received the goods (digitally or otherwise). Example evidence includes IP addresses, corresponding timestamps/dates, cardholder’s name and email address linked to a cardholder profile held by the seller, proof the same device and card (used in dispute) were previously used in prior undisputed transaction, and any related detailed activity.

            - `AUTHORIZATION_DOCUMENTATION`: **[File Only]** Evidence that the cardholder did provide authorization for the charge. Example evidence includes a signed credit card authorization.

            - `CANCELLATION_OR_REFUND_DOCUMENTATION`: Evidence that the cardholder acknowledged your refund or cancellation policy. Example evidence includes a signature or checkbox showing the cardholder’s acknowledgement of your refund or cancellation policy.

            - `CARDHOLDER_COMMUNICATION`: **[File Only]** Evidence that shows relevant communication with the cardholder. Example evidence includes emails or texts that show the cardholder received goods/services or demonstrate cardholder satisfaction.

            - `CARDHOLDER_INFORMATION`: Evidence that validates the customer''s identity. Example evidence includes personally identifiable details such as name, email address, purchaser IP address, and a copy of the cardholder ID.

            - `PURCHASE_ACKNOWLEDGEMENT`: Evidence that shows proof of the sale/transaction. Example evidence includes an invoice, contract, or other item showing the customer’s acknowledgement of the purchase and your terms.

            - `DUPLICATE_CHARGE_DOCUMENTATION`: **[File Only]** Evidence that shows the charges in question are valid and distinct from one another. Example evidence includes receipts, shipping labels, and invoices along with their distinct payment IDs.

            - `PRODUCT_OR_SERVICE_DESCRIPTION`: A description of the product or service sold.

            - `RECEIPT`: A receipt or message sent to the cardholder detailing the charge. Note: You do not need to upload the Square receipt; Square submits the receipt on your behalf.

            - `SERVICE_RECEIVED_DOCUMENTATION`: Evidence that the service was provided to the cardholder or the expected date that services will be rendered. Example evidence includes a signed delivery form, work order, expected delivery date, or other written agreements.

            - `PROOF_OF_DELIVERY_DOCUMENTATION`: Evidence that shows the product was provided to the cardholder or the expected date of delivery. Example evidence includes a signed delivery form or written agreement acknowledging receipt of the goods or services.

            - `RELATED_TRANSACTION_DOCUMENTATION`: Evidence that shows the cardholder previously processed transactions on the same card and did not dispute them.

            - `REBUTTAL_EXPLANATION`: An explanation of why the cardholder’s claim is invalid. Example evidence includes an explanation of why each distinct charge is a legitimate purchase, why the cardholder’s claim for credit owed due to their attempt to cancel, return, or refund is invalid per your stated policy and cardholder agreement, or an explanation of how the cardholder did not attempt to remedy the issue with you first to receive credit.

            - `TRACKING_NUMBER`: The tracking number for the order provided by the shipping carrier. If you have multiple numbers, they need to be submitted individually as separate pieces of evidence.'
        file:
          $ref: '#/components/schemas/DisputeEvidenceFile'
          description: If the evidence is of type `FILE`, contains metadata about the binary file uploaded as evidence.
        text:
          type: string
          description: 'If the evidence is of type `TEXT`, contains the blob of text created as evidence.


            Min length: `1`

            Max length: `500`'
        type:
          $ref: '#/components/schemas/DisputeEvidenceType'
          description: 'Indicates if the evidence is a file or plain text.


            Current values:

            - `TEXT`: The evidence is a blob of text under 500 characters.

            - `FILE`: The evidence is an uploaded binary file.'
        created_at:
          type: string
          format: date-time
          description: When this evidence was created, in [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339) format (UTC).
        metadata:
          $ref: '#/components/schemas/Metadata'
      required:
      - id
      - dispute_id
      - category
      - type
      - created_at
      title: DisputeEvidence
    DisputesDisputeIdEvidenceTextPostRequestBodyContentApplicationJsonSchemaEvidence:
      type: object
