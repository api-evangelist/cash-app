openapi: 3.2.0
info:
  title: Cash App Disputes API
  version: 1.0.0
  description: 'Operations tagged Disputes across 2 of this provider''s published API definitions: cash-app-disputes-openapi.json, cash-app-network-api-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://global-api-sandbox.afterpay.com
  description: Sandbox
- url: https://global-api.afterpay.com
  description: Production
- url: https://api.cash.app/network/v1
  description: Production
- url: https://sandbox.api.cash.app/network/v1
  description: Sandbox
tags:
- name: Disputes
paths:
  /v2/disputes:
    get:
      operationId: retrieve-dispute
      summary: Retrieve Dispute
      description: List disputes within a date range based on certain criteria. This endpoint can be used for debugging or synchronizing the disputes from Afterpay if/when you are unable to use the webhook method.
      tags:
      - Disputes
      parameters:
      - name: order
        in: query
        description: Payment or Order token using which you can filter the list.
        required: false
        schema:
          type: integer
      - name: merchant
        in: query
        description: Merchant token using which you can filter the list.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Dispute status using which you can filter the list.
        required: false
        schema:
          type: string
      - name: openedAfter
        in: query
        description: Filter disputes that were created on or after this timestamp (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: openedBefore
        in: query
        description: Filter disputes that were created on or before this timestamp (inclusive).
        required: false
        schema:
          type: string
          format: date-time
      - name: offset
        in: query
        description: Offset for the search results.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: The maximum number of records that you want returned from this request.
        required: false
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retrieve-dispute_Response_200'
    servers:
    - url: https://global-api-sandbox.afterpay.com
      description: Sandbox
    - url: https://global-api.afterpay.com
      description: Production
  /v2/disputes/{dispute_id}:
    get:
      operationId: receive-dispute
      summary: Receive Dispute
      description: Get detailed information about a dispute.
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json
        required: false
        schema:
          type: string
          default: application/json
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dispute'
    post:
      operationId: respond-to-dispute
      summary: Respond to Dispute
      description: 'The Respond to the Dispute endpoint allows a merchant to submit evidence for the dispute. This is only allowed if the dispute is the state `needs_response`.


        Merchants only have one opportunity to submit evidence. Once a 200 response is received, this information cannot be updated or changed.'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json
        required: false
        schema:
          type: string
      responses:
        '200':
          description: When successful, returns the updated dispute object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dispute'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: A unique ID given to a dispute.
                evidence:
                  $ref: '#/components/schemas/evidence'
                  description: Evidence for the dispute. Note that there should be at least one valid field.
    servers:
    - url: https://global-api-sandbox.afterpay.com
      description: Sandbox
    - url: https://global-api.afterpay.com
      description: Production
  /v2/disputes/{dispute_id}/accept:
    get:
      operationId: accept-dispute
      summary: Accept Dispute
      description: 'Merchants can call this endpoint to accept a dispute case. The endpoint only works if the dispute is in a non-terminal state (the status is not `won` or `lost`).


        > **Note:** Calling the API changes the dispute status to lost.'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - in: query
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json
        required: false
        schema:
          type: string
      responses:
        '200':
          description: If successful, returns the updated dispute object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dispute'
    servers:
    - url: https://global-api-sandbox.afterpay.com
      description: Sandbox
    - url: https://global-api.afterpay.com
      description: Production
  /v2/disputes/files:
    post:
      operationId: upload-file
      summary: Upload File
      description: Use this endpoint to upload files for disputes.
      tags:
      - Disputes
      parameters:
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Indicates a successful file upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/upload-file_Response_200'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  description: The file you want to upload.
                fileType:
                  type: string
                  description: The type of file. Only `dispute_evidence` is supported.
              required:
              - file
              - fileType
    servers:
    - url: https://global-api-sandbox.afterpay.com
      description: Sandbox
    - url: https://global-api.afterpay.com
      description: Production
  /v2/disputes/files/{id}:
    get:
      operationId: retrieve-file
      summary: Retrieve file
      description: Use this endpoint to retrieve files for disputes.
      tags:
      - Disputes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: query
        description: ID of the file to be retrieved.
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: Basic authentication
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        description: application/json
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Indicates that the file has been retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/retrieve-file_Response_200'
        '401':
          description: Unauthorized. Invalid merchant credentials.
          content:
            application/json:
              schema:
                description: Any type
        '404':
          description: Not Found. The corresponding entity can't be found for the merchant.
          content:
            application/json:
              schema:
                description: Any type
        '412':
          description: Precondition Failed. Invalid action for the dispute case, or the refund amount is larger than the refundable amount.
          content:
            application/json:
              schema:
                description: Any type
        '413':
          description: Request Entity Too Large. The uploaded file is too large. It must be less than 10 MB.
          content:
            application/json:
              schema:
                description: Any type
        '415':
          description: 'Unsupported Media Type. Afterpay does not support the filetype of the uploaded file. It must be: GIF, PDF, JPEG, or PNG.'
          content:
            application/json:
              schema:
                description: Any type
        '422':
          description: Unprocessable Entity. Invalid parameter in the Dispute API request.
          content:
            application/json:
              schema:
                description: Any type
        '429':
          description: Too Many Requests. Too many requests in a short period of time, retry later.
          content:
            application/json:
              schema:
                description: Any type
    servers:
    - url: https://global-api-sandbox.afterpay.com
      description: Sandbox
    - url: https://global-api.afterpay.com
      description: Production
  /disputes:
    get:
      operationId: list-disputes
      summary: List disputes
      description: 'Returns a list of all disputes (matching the given query parameters) associated with payments created by this client.


        **This endpoint is rate limited to 50 QPS.**


        Scopes: `DISPUTES_READ`'
      tags:
      - Disputes
      parameters:
      - name: cursor
        in: query
        description: A pagination cursor returned by a previous call to this endpoint. Provide this cursor to retrieve the next set of results for the original query.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of disputes to return.
        required: false
        schema:
          type: integer
          default: 50
      - name: merchant_id
        in: query
        description: Filters results to only include disputes filed against a merchant that matches the the given ID.
        required: false
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_list-disputes_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}:
    get:
      operationId: getDisputesByDisputeId
      summary: Retrieve dispute
      description: 'Retrieves a dispute by its ID.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_READ`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_retrieve-dispute_Response_200'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-operation-id-source: normalized
      x-operation-id-original: retrieve-dispute
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/accept:
    post:
      operationId: postDisputesByDisputeIdAccept
      summary: Accept dispute
      description: 'Resolves a dispute by having the merchant accept responsibility for it. This leads to a "loss" of the dispute from the merchant''s perspective, and a "win" of the dispute from the customer''s perspective.


        After a dispute is accepted, the decision is final; it can never be changed.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_WRITE`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_accept-dispute_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-operation-id-source: normalized
      x-operation-id-original: accept-dispute
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/challenge:
    post:
      operationId: challenge-dispute
      summary: Challenge dispute
      description: 'Submits evidence uploaded to this dispute to Cash App Pay for review.


        After Cash App Pay reviews the dispute, a final decision will be reached and funds will be settled appropriately. If this endpoint is not called by the `response_due_at` timestamp, the merchant will automatically "lose" the dispute.


        Challenging a dispute does not guarantee that the merchant will "win" it. It only means that it will be reviewed, instead of being automatically accepted by the merchant.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_WRITE`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_challenge-dispute_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/evidence:
    get:
      operationId: list-dispute-evidence
      summary: List dispute evidence
      description: 'Returns a list of all pieces of evidence associated with the given dispute.


        **This endpoint is rate limited to 50 QPS.**


        Scopes: `DISPUTES_READ`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: A pagination cursor returned by a previous call to this endpoint. Provide this cursor to retrieve the next set of results for the original query.
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of pieces of dispute evidence to return
        required: false
        schema:
          type: integer
          default: 50
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_list-dispute-evidence_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/evidence-text:
    post:
      operationId: create-dispute-evidence-text
      summary: Create dispute evidence text
      description: 'Creates a piece of evidence for the given dispute from a blob of plain text, which can then be submitted with the challenge dispute endpoint.


        If you have more than 500 characters of text to submit as evidence, split it into multiple pieces where possible.


        Uploading evidence does not challenge the dispute. Make sure to call the challenge dispute endpoint before the `response_due_at` timestamp, or else the merchant will automatically "lose" the dispute.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_WRITE`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_create-dispute-evidence-text_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              type: object
              properties:
                idempotency_key:
                  $ref: '#/components/schemas/IdempotencyKey'
                evidence:
                  $ref: '#/components/schemas/DisputesDisputeIdEvidenceTextPostRequestBodyContentApplicationJsonSchemaEvidence'
                  description: Details about the evidence to create.
              required:
              - idempotency_key
              - evidence
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/evidence-file:
    post:
      operationId: create-dispute-evidence-file
      summary: Create dispute evidence file
      description: 'Uploads a binary file as a piece of evidence for the given dispute, which can then be submitted with the challenge dispute endpoint.


        The file must be one of the supported formats, or else it may not be usable to challenge the dispute:


        - `JPEG`

        - `HEIC`

        - `HEIF`

        - `PNG`

        - `PDF`

        - `TIFF`


        Uploading evidence does not challenge the dispute. Make sure to call the challenge dispute endpoint before the `response_due_at` timestamp, or else the merchant will automatically "lose" the dispute.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_WRITE`


        ---


        ### Example request payload (cURL)


        The following example shows how to make a request to upload a dispute file. There are two "parts" of the request:


        - `request`, a JSON blob that contains details about the file to upload

        - `file`, which contains the binary data for the file to be uploaded.


        Using `cURL` to make the request, the request would look like the example below. Please refer to documentation for your particular language / framework and `multipart/form-data` requests to see how you should implement it in your own codebase.


        Please refer to Signing Multipart Requests to compute a signature for the request.


        ```curl

        curl --request POST ''https://sandbox.api.cash.app/network/v1/disputes/DSPT_ztqn5hd8wmrzjzavmf60pjbzf/evidence-file'' \

        --header ''Accept: application/json'' \

        --header ''Authorization: Client CLIENT_ID API_KEY_ID'' \

        --header ''Content-Type: multipart/form-data'' \

        --header ''X-Region: PDX'' \

        --form ''request={

        "idempotency_key": "e445c3fb-2caa-46fd-b0d3-aa7c7b00ab41",

        "evidence": {

        "category": "AUTHORIZATION_DOCUMENTATION",

        "file": {

        "filename": "evidence.pdf",

        "content_type": "application/pdf"

        }

        }

        }'' \

        --form ''signature=SIGNATURE'' \

        --form ''file=path-to-file.pdf''

        ```'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_create-dispute-evidence-file_Response_201'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        description: ''
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                request:
                  $ref: '#/components/schemas/DisputesDisputeIdEvidenceFilePostRequestBodyContentMultipartFormDataSchemaRequest'
                  description: JSON-encoded payload describing the contents of the file uploaded
                file:
                  type: string
                  format: binary
                  description: 'Binary file to upload


                    Min size: `1 byte`

                    Max size: `5 megabytes`'
              required:
              - request
              - file
    servers:
    - url: https://api.cash.app/network/v1
      description: Production
    - url: https://sandbox.api.cash.app/network/v1
      description: Sandbox
  /disputes/{dispute_id}/evidence/{evidence_id}:
    delete:
      operationId: delete-dispute-evidence
      summary: Delete dispute evidence
      description: 'Deletes a piece of dispute evidence by the ID of the dispute its for and its own ID.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_WRITE`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: true
        schema:
          type: string
      - name: X-Region
        in: header
        required: true
        schema:
          type: string
      - name: X-Signature
        in: header
        required: true
        schema:
          type: string
      - name: User-Agent
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disputes_delete-dispute-evidence_Response_200'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: retrieve-dispute-evidence
      summary: Retrieve dispute evidence
      description: 'Retrieves a piece of dispute evidence by the ID of the dispute its for and its own ID.


        **This endpoint is not rate limited.**


        Scopes: `DISPUTES_READ`'
      tags:
      - Disputes
      parameters:
      - name: dispute_id
        in: path
