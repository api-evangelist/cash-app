aid: cash-app
name: Cash App
review:
  question: Does Cash App expose a public first-party developer API with downloadable
    OpenAPI specifications, and what is its US open-finance posture (FDX / CFPB 1033
    / aggregator)?
  answer: true
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Cash App (operated by Block, Inc., formerly Square) runs a real, public,
    first-party developer portal at https://developers.cash.app (built on the
    Fern docs platform). The portal's "Available APIs" listing
    (https://developers.cash.app/openapi.json) enumerates 12 downloadable
    OpenAPI 3.1.0 specifications, all of which were harvested verbatim into
    openapi/. The public developer surface is a merchant / payment-service-
    provider PAYMENT-ACCEPTANCE product, NOT a consumer-permissioned data-access
    (open-banking) API. There are two distinct API families:

    1. Cash App Pay Partner API on host api.cash.app - three REST APIs:
       Customer Request API (customer-request/v1), Network API (network/v1),
       and Management API (management/v1). Docs describe the flow: create a
       customer request, get customer approval to mint a grant, then use the
       grant to create a payment. The Management API issues scoped API keys and
       manages webhooks (API-key auth). A Pay Kit JavaScript SDK wraps the
       Customer Request API with prebuilt UI. These specs ship no
       components.securitySchemes; auth (scoped API keys) is described in prose
       docs rather than the OpenAPI security object.
    2. Afterpay / Cash App Afterpay Global API on host global-api.afterpay.com -
       nine specs (Payments, Checkouts, Orders, Configuration, Disputes, Grants
       - Afterpay, Add Cash App Pay to Your Site / Grants - Cash App Pay,
       Service Status, and a deprecated Billing Agreements API). These declare
       HTTP Basic auth (securityScheme sec0: http/basic) and expose sandbox
       (global-api-sandbox.afterpay.com) and production hosts.

    Cash App is NOT a chartered bank: deposit accounts and the Cash App Card are
    issued by partner banks (historically Sutton Bank and Lincoln Savings Bank).
    No FDX (Financial Data Exchange) participation and no CFPB Section 1033
    personal-financial-data-rights posture is documented anywhere in the
    developer portal. Consumer-side account/transaction data is reached by third
    parties through aggregators (e.g. Plaid), not via a first-party FDX
    data-access API. The open-finance reality here is aggregator-mediated for
    consumer data; the first-party API is purely merchant payment acceptance.
  developerPortal:
    url: https://developers.cash.app/home
    httpStatus: 200
    confirmed: true
    platform: Fern (buildwithfern) - exposes /llms.txt index and an MCP server at
      https://developers.cash.app/_mcp/server
  authModel:
    cashAppPayPartnerApi: Scoped API keys issued via the Management API (described
      in docs; no securityScheme declared in the OpenAPI documents)
    afterpayGlobalApi: HTTP Basic authentication (securityScheme sec0 http/basic
      declared in the specs)
