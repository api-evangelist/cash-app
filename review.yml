  openFinancePosture:
    firstPartyDeveloperApi: true
    surfaceType: Merchant / PSP payment acceptance (Cash App Pay + Cash App Afterpay)
    consumerDataAccessApi: false
    fdxParticipant: false
    fdxNote: No FDX participation documented in the developer portal.
    section1033Posture: none-documented
    aggregatorAccess: true
    aggregatorNote: Consumer account/transaction data is reached by third parties
      via aggregators such as Plaid rather than a first-party FDX/data-access API.
    charterType: Not a chartered bank; Block, Inc. fintech with bank-partner-issued
      accounts and card (historically Sutton Bank, Lincoln Savings Bank).
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.cash.app
      documented: true
      note: Cash App Pay Partner API (Customer Request, Network, Management).
    - protocol: REST
      scheme: https
      baseURL: https://global-api.afterpay.com
      documented: true
      note: Afterpay / Cash App Afterpay Global API; sandbox at
        https://global-api-sandbox.afterpay.com.
